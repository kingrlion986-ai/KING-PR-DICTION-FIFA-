<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin FIFA</title>
<style>
body{font-family:Arial;background:#0f172a;color:white;margin:0;padding:20px}
main{max-width:700px;margin:auto}
.card{background:#1e293b;padding:20px;border-radius:14px}
h1{text-align:center}
textarea,input,button{width:100%;box-sizing:border-box;margin-top:10px;padding:14px;border-radius:9px;border:0}
textarea{height:280px;background:#020617;color:white}
input{background:#020617;color:white}
button{background:#2563eb;color:white;font-weight:bold;font-size:16px;cursor:pointer}
#msg{margin-top:15px;padding:12px;border-radius:8px}
.example{color:#94a3b8;font-size:14px;line-height:1.6}
</style>
</head>

<body>
<main>
<div class="card">
<h1>⚽ ADMIN FIFA</h1>

<p>Colle plusieurs résultats :</p>

<div class="example">
Chelsea 2-1 Leeds United | 2026-08-15 | 20:30<br>
Brentford 1-3 Chelsea | 2026-08-15 | 19:50<br>
Crystal Palace 1-1 Arsenal | 2026-08-15 | 18:30
</div>

<textarea id="matches" placeholder="Équipe 2-1 Équipe | DATE | HEURE"></textarea>

<button onclick="save()">💾 ENREGISTRER LES MATCHS</button>

<div id="msg"></div>
</div>
</main>

<script>
async function save(){
 const text=document.getElementById("matches").value.trim();
 const msg=document.getElementById("msg");

 if(!text){
   msg.textContent="❌ Aucun match à importer.";
   return;
 }

 msg.textContent="⏳ Enregistrement...";

 const lines=text.split("\n").map(x=>x.trim()).filter(Boolean);

 try{
   const response=await fetch("/api/matches",{
     method:"POST",
     headers:{"Content-Type":"application/json"},
     body:JSON.stringify({text:lines})
   });

   const data=await response.json();

   if(!response.ok || !data.success)
     throw new Error(data.message||"Erreur d'importation");

   msg.textContent=
     `✅ ${data.added} ajouté(s) | `+
     `♻️ ${data.duplicates} doublon(s) | `+
     `❌ ${data.invalid} invalide(s)`;

   if(data.added>0)
     document.getElementById("matches").value="";

 }catch(e){
   msg.textContent="❌ "+e.message;
 }
}
</script>
</body>
</html>
