<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>ROI Prediction FIFA</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0b1020;
      color: white;
    }

    .container {
      max-width: 900px;
      margin: auto;
      padding: 40px 20px;
      text-align: center;
    }

    h1 {
      font-size: 36px;
      margin-bottom: 10px;
    }

    .subtitle {
      color: #9ca3af;
      margin-bottom: 40px;
    }

    .status {
      display: inline-block;
      padding: 10px 18px;
      border-radius: 20px;
      background: #12351f;
      color: #4ade80;
      margin-bottom: 30px;
    }

    .card {
      background: #151b2f;
      border-radius: 16px;
      padding: 30px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.3);
    }

    .teams {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 30px;
      font-size: 24px;
      margin: 30px 0;
    }

    .vs {
      color: #9ca3af;
      font-size: 16px;
    }

    button {
      border: none;
      border-radius: 10px;
      padding: 14px 25px;
      background: #2563eb;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    button:hover {
      background: #1d4ed8;
    }

    #result {
      margin-top: 25px;
      color: #9ca3af;
    }
  </style>
</head>

<body>

  <div class="container">

    <h1>⚽ ROI Prediction FIFA</h1>

    <div class="subtitle">
      Intelligence artificielle pour les compétitions FIFA virtuelles
    </div>

    <div class="status">
      ● Système prêt
    </div>

    <div class="card">

      <h2>FIFA Virtual AI</h2>

      <div class="teams">
        <span>TEAM A</span>
        <span class="vs">VS</span>
        <span>TEAM B</span>
      </div>

      <button onclick="checkAI()">
        Vérifier l'IA
      </button>

      <div id="result">
        En attente du moteur de prédiction...
      </div>

    </div>

  </div>

  <script>
    async function checkAI() {
      const result = document.getElementById("result");

      result.textContent = "Connexion au moteur...";

      try {
        const response = await fetch("/api/status");
        const data = await response.json();

        result.textContent =
          data.message + " — Version " + data.version;

      } catch (error) {
        result.textContent =
          "Impossible de contacter le serveur.";
      }
    }
  </script>

</body>
</html>
